services:
  rp-chat:
    build: .
    container_name: rp-chat
    restart: unless-stopped
    user: "1000:1000"          # 호스트의 pi 계정. ./data 쓰기 권한을 맞추기 위함입니다.
    ports:
      # 모든 인터페이스에 묶습니다. 같은 LAN 의 다른 기기에서 <파이IP>:5173 으로 직접 접속할 수 있고,
      # Nginx Proxy Manager 도 그대로 붙습니다.
      - "5173:5173"
    volumes:
      - ./data:/data
    environment:
      # --- 엔진 주소 허용 목록 (SSRF 방지) ---
      # LM Studio 가 도는 PC 의 LAN IP. 여기 없는 내부 주소로는 요청이 나가지 않습니다.
      LOCAL_ENGINE_HOSTS: "192.168.0.10"
      # OpenRouter 등 직접 추가한 외부 엔진이 있을 때만 씁니다.
      # EXTRA_ENGINE_HOSTS: "openrouter.ai"

      # --- API 키 ---
      # 여기에 넣으면 data/settings.json 에 평문으로 남지 않습니다.
      # 값은 .env 파일에 두고 깃에는 올리지 마세요.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"

      # --- 프록시 ---
      # NPM 을 믿어야 요청 제한이 실제 접속자 기준으로 걸리고, https 로 들어올 때 Secure 쿠키가 붙습니다.
      # NPM 이 도는 기기의 LAN IP 로 좁히는 것이 가장 좋습니다. 예: TRUST_PROXY: "192.168.0.20"
      # "1" 이면 LAN 에서 직접 들어온 사람이 X-Forwarded-For 를 꾸며 IP 별 제한을 피할 수 있습니다.
      # (로그인 시도는 IP 와 상관없는 전체 상한이 따로 막습니다.)
      TRUST_PROXY: "1"

      # --- 계정 ---
      # 로그인 계정은 컨테이너 안에서 만듭니다. 데이터 폴더(./data/users.json)에 저장됩니다.
      #   docker compose exec rp-chat node scripts/user.js add <아이디>
