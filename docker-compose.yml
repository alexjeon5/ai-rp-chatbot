services:
  rp-chat:
    build: .
    container_name: rp-chat
    restart: unless-stopped
    user: "1000:1000"          # 호스트의 pi 계정. ./data 쓰기 권한을 맞추기 위함입니다.
    ports:
      # 모든 인터페이스에 묶습니다. 같은 LAN 의 다른 기기에서 <파이IP>:5173 으로 직접 접속할 수 있고,
      # Nginx Proxy Manager 도 그대로 붙습니다.
      - "5173:5173"
    volumes:
      - ./data:/data
    environment:
      # --- 엔진 주소 허용 목록 (SSRF 방지) ---
      # LM Studio 가 도는 PC 의 LAN IP. 여기 없는 내부 주소로는 요청이 나가지 않습니다.
      LOCAL_ENGINE_HOSTS: "192.168.0.10"
      # OpenRouter 등 직접 추가한 외부 엔진이 있을 때만 씁니다.
      # EXTRA_ENGINE_HOSTS: "openrouter.ai"

      # --- API 키 ---
      # 여기에 넣으면 data/settings.json 에 평문으로 남지 않습니다.
      # 값은 .env 파일에 두고 깃에는 올리지 마세요.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"

      # 리버스 프록시(Nginx Proxy Manager)를 통해서도 들어오고, 이제 LAN 에서 직접도 들어옵니다.
      # "1"로 두면 누구든 X-Forwarded-For 헤더를 위조해서 요청 제한(레이트 리밋)을 우회할 수 있습니다.
      # NPM 이 도는 기기의 LAN IP를 알면 그 주소로 좁혀 주세요. 예: TRUST_PROXY: "192.168.0.20"
      TRUST_PROXY: "1"
